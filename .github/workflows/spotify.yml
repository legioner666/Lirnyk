name: Spotify prototype (private)

# TASK 003 — Lirnyk Remote (app.lirnyk.remote). Never published to GitHub Releases: the APK leaves CI only as an
# artifact ENCRYPTED with the owner's passphrase (secret LIRNYK_APK_PASSPHRASE); scripts/termux/get-remote-apk.sh
# downloads and decrypts it on the owner's phone.
on:
  push:
    branches: [ 'claude/spotify' ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.LIRNYK_TEST_KEYSTORE_BASE64 != '' && secrets.LIRNYK_APK_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotify App Remote SDK (official, checksum-pinned)
        run: ./scripts/fetch-spotify-sdk.sh

      - name: Unit tests (prototype model)
        run: ./gradlew --no-daemon :spotify:model:test

      - name: Lint
        run: ./gradlew --no-daemon :spotify:app:lintRelease

      - name: Signing key required
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::No test key yet: run scripts/termux/setup-signing.sh on the phone. Without it the APK would carry a random debug certificate that Spotify does not know, so no APK is built."

      - name: Test signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LIRNYK_TEST_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lirnyk-test.p12"
          echo "LIRNYK_TEST_KEYSTORE=$RUNNER_TEMP/lirnyk-test.p12" >> "$GITHUB_ENV"

      - name: Build APK
        if: env.HAS_KEY == 'true'
        env:
          LIRNYK_TEST_KEYSTORE_PASSWORD: ${{ secrets.LIRNYK_TEST_KEYSTORE_PASSWORD }}
          LIRNYK_TEST_CERT_SHA1: ${{ vars.LIRNYK_TEST_CERT_SHA1 }}
        run: ./gradlew --no-daemon :spotify:app:assembleRelease

      - name: Guard — merged manifest (no network, no notification listener, no accessibility)
        if: env.HAS_KEY == 'true'
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=spotify/app/build/outputs/apk/release/app-release.apk
          "$AAPT2" dump permissions "$apk" > perms.txt
          manifest=$(find spotify/app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          python3 scripts/check_manifest.py "$manifest" perms.txt
          "$AAPT2" dump badging "$apk" | head -1 | grep -q "name='app.lirnyk.remote'"

      # TASK 003 item 9: the APK's real certificate must be the one registered in the Spotify dashboard.
      - name: Guard — signing SHA-1 matches the Spotify registration
        if: env.HAS_KEY == 'true'
        env:
          EXPECTED: ${{ vars.LIRNYK_TEST_CERT_SHA1 }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs spotify/app/build/outputs/apk/release/app-release.apk > sig.txt
          actual=$(grep -m1 "Signer #1 certificate SHA-1 digest" sig.txt | sed 's/.*: //' | tr -d ':' | tr 'a-f' 'A-F')
          expected=$(echo "$EXPECTED" | tr -d ':' | tr 'a-f' 'A-F')
          echo "### Signing SHA-1: ${actual}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$expected" ]; then echo "::error::Repository variable LIRNYK_TEST_CERT_SHA1 is not set (scripts/termux/setup-signing.sh sets it)"; exit 1; fi
          if [ "$actual" != "$expected" ]; then echo "::error::APK SHA-1 $actual != registered $expected"; exit 1; fi
          echo "SHA-1 matches the registered value."

      - name: Encrypt APK (private delivery)
        if: env.HAS_KEY == 'true'
        env:
          APK_PASS: ${{ secrets.LIRNYK_APK_PASSPHRASE }}
        run: |
          mkdir -p out
          short=$(git rev-parse --short HEAD)
          name="LirnykRemote-${GITHUB_RUN_NUMBER}-${short}.apk"
          cp spotify/app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "out/$name.sha256"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -in "$name" -out "out/$name.enc" -pass env:APK_PASS
          rm -f "$name" spotify/app/build/outputs/apk/release/app-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: lirnyk-remote-${{ github.run_number }}
          path: out/*
          retention-days: 14
