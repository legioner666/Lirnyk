name: Android CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint (all modules)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIRNYK_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lirnyk-test.p12"
            echo "LIRNYK_TEST_KEYSTORE=$RUNNER_TEMP/lirnyk-test.p12" >> "$GITHUB_ENV"
          fi

      - name: Build APKs (debug + minified release)
        env:
          LIRNYK_TEST_KEYSTORE_PASSWORD: ${{ secrets.LIRNYK_TEST_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # Product guarantees, enforced on every build against the final (merged) manifest and the APK itself.
      - name: Guard — merged manifest (permission allowlist, no sensitive services)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk > perms.txt
          manifest=$(find app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          echo "merged manifest: $manifest"
          python3 scripts/check_manifest.py "$manifest" perms.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release.apk > manifest-tree.txt
          if grep -E "NotificationListenerService|BIND_NOTIFICATION_LISTENER|AccessibilityService|BIND_ACCESSIBILITY" manifest-tree.txt; then
            echo "::error::the APK manifest contains a notification listener or accessibility service"; exit 1
          fi

      - name: Guard — no notification or accessibility code
        run: |
          if grep -rnE "NotificationListenerService|AccessibilityService|onNotificationPosted|getActiveNotifications|StatusBarNotification|getActiveSessions" --include=*.kt --include=*.java core feature app; then
            echo "::error::Lirnyk must not read notifications or use accessibility services"; exit 1
          fi

      - name: Signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          { echo "### Signature"; echo '```'; grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" signature.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::warning::Signed with the runner's debug key (secret LIRNYK_TEST_KEYSTORE_BASE64 not set): the certificate changes on every build."
          fi

      - name: Guard — APK size (8 MB)
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $size bytes"
          echo "### Release APK size: $((size / 1024)) KiB (limit 8192 KiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 8388608 ]; then echo "::error::APK is larger than 8 MB"; exit 1; fi

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.*
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Collect outputs with checksums
        run: |
          mkdir -p out
          short=$(git rev-parse --short HEAD)
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          # Minified release build signed with the public debug key: installs as "app.lirnyk", for testing only.
          cp app/build/outputs/apk/release/app-release.apk "out/Lirnyk-test-${branch}-${GITHUB_RUN_NUMBER}-${short}.apk"
          cp app/build/outputs/apk/release/app-release.apk out/Lirnyk-test.apk
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          signer=$(grep -m1 "Signer #1 certificate SHA-256" signature.txt | sed 's/.*: //')
          {
            echo "TEST BUILD — not a stable release, not for Google Play."
            echo "Signing certificate SHA-256: ${signer}"
            echo ""
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Build: ${GITHUB_RUN_NUMBER} (versionName 0.1.${GITHUB_RUN_NUMBER})"
            echo ""
            echo "SHA-256:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: lirnyk-${{ github.run_number }}
          path: out/*

      - name: Publish test build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build out/* --prerelease --title "Lirnyk test build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" --notes-file notes.md --target "${GITHUB_SHA}"
